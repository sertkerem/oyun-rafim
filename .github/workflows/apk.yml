name: APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk oyun-rafim.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Oyun Rafım APK
          body: Telefona indirip kurmak için oyun-rafim.apk dosyasını aç.
          files: oyun-rafim.apk
          make_latest: true
